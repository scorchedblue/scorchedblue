# Toolchain versions only. Commands live in the justfile.
#
# No language runtime here: this repository builds a container image, it does
# not compile anything. The Rust toolchain lives in scorched-tools instead.
#
# shellcheck, shfmt and trivy are pinned here rather than assumed present so
# that CI and a fresh machine agree with this one by construction.
[tools]
gitleaks = "8.30.1"
just = "1.57.0"
shellcheck = "0.11.0"
shfmt = "3.14.0"
trivy = "0.74.0"
