# SonarQube Cloud project identity. Both keys are required for Cloud; the
# project was created under the scorchedblue organisation and its key cannot be
# changed without creating a different project.
sonar.projectKey=scorchedblue_scorchedblue
sonar.organization=scorchedblue

# The whole tree. files/usr/libexec/* are shell scripts that `just lint`
# already covers, so excluding files/ would hide real code from the scan;
# Sonar ignores the file types it does not analyse without help.
sonar.sources=.

# Sonar's Docker analyser matches Dockerfile, Dockerfile.* and *.dockerfile.
# This repository's is named Containerfile, which matches none of them, so
# without this the whole Containerfile is skipped silently and Docker analysis
# reports clean having read nothing at all.
#
# Setting this REPLACES the defaults rather than adding to them, so the default
# patterns are repeated here on purpose. Do not trim them.
sonar.lang.patterns.docker=**/Containerfile,**/Dockerfile,**/Dockerfile.*,**/*.dockerfile
