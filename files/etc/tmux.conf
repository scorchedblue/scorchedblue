# ScorchedBlue -- system default tmux configuration.
#
# /etc/tmux.conf is the one system-wide config path tmux reads (`man tmux`,
# FILES); it is sourced before ~/.tmux.conf and $XDG_CONFIG_HOME/tmux/tmux.conf,
# so a user file still wins on any option set in both. This sets the default
# without taking the choice away, the same shape /etc/fastfetch/config.jsonc
# already uses.
#
# tmux itself ships from the base (see scripts/10-packages.sh); this file is
# what was actually missing -- without it every session starts from tmux's
# compiled-in defaults, which is not a coherent work surface out of the box.
#
# Status bar styling is deliberately not touched here: it becomes a theme
# engine target in P4, and hardcoding colours now would be work thrown away.

# neovim is this image's $EDITOR. tmux's default 500ms escape-time exists to
# disambiguate a bare Escape key from the start of an escape sequence (e.g. an
# arrow key), but that delay is exactly what makes leaving insert mode in
# neovim feel laggy inside tmux. 10ms is short enough that no terminal's
# escape sequences are mistaken for a bare Escape, and long enough to still
# disambiguate.
set -sg escape-time 10

# Advertise 256-colour and true-colour support so syntax highlighting (neovim,
# bat, delta) renders the same inside tmux as outside it. This is terminal
# capability negotiation, not status bar styling -- it changes nothing drawn by
# tmux itself.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
