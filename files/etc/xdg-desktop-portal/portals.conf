# Explicit portal arbitration.
#
# Order matters and is the whole point: xdg-desktop-portal-hyprland is the only
# backend offering an arbitrary-region share picker, which is the capability a
# GNOME session could not provide. It must win for ScreenCast.
#
# xdg-desktop-portal-gtk backs the interfaces hyprland's portal does not
# implement -- file chooser, settings, print.
#
# Stating this explicitly is not optional housekeeping: with more than one
# backend installed and no preference declared, D-Bus arbitration picks a
# winner and screen sharing breaks in a way that is very hard to diagnose.
[preferred]
default=hyprland;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Settings=gtk;
