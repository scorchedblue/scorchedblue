# greetd, configured to launch tuigreet against the installed Wayland sessions.
#
# Without this file greetd runs its stock `agreety --cmd /bin/sh`: a text
# greeter that prints /etc/issue and drops to a shell. That looks almost
# exactly like a getty login prompt, which makes "the greeter is unconfigured"
# and "the display manager never started" indistinguishable on a screenshot.
#
# vt = 1 is greetd's own default and is safe: greetd.service already declares
# Conflicts=getty@tty1.service, so systemd stops the getty rather than the two
# fighting over the console.

[terminal]
vt = 1

[default_session]
# `scorched greeter`, which execs tuigreet with the full argument list. Two of
# those arguments contain spaces -- the time format and the greeting -- and this
# is the one process where a bad split means nobody can log in, so they stay
# inside the binary where nothing splits them at all.
#
# Splitting here is not a guess: greetd(5) states that the command-line "is run
# by sh(1), and as such accepts standard POSIX shell syntax" -- verified against
# the greetd 0.10.3 man page this image ships. Neither word below contains a
# space or a shell metacharacter, so sh yields exactly these two arguments.
#
# This replaces /usr/libexec/scorched-greeter, which was a bash wrapper around
# the same tuigreet invocation. The wrapper is deleted rather than left in
# place: two copies of one argv, only one of them tested, is how they drift.
command = "/usr/bin/scorched greeter"
user = "greetd"
