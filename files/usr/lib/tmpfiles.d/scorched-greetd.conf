# greetd's package drops state straight into /var/lib/greetd, including a mask
# for the user xdg-desktop-portal service. On a bootc image /var is deployment
# state, not image content: anything baked there belongs to the first
# deployment only and is never updated afterwards. bootc's var-tmpfiles lint
# flags exactly this.
#
# Declaring it here instead means systemd recreates it on every deployment,
# which is both correct and what the lint asks for. The entries below are the
# ones `bootc container lint` printed; directories must precede the symlink.
d /var/lib/greetd/.config 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd 0755 greetd greetd - -
d /var/lib/greetd/.config/systemd/user 0755 greetd greetd - -
L /var/lib/greetd/.config/systemd/user/xdg-desktop-portal.service - - - - /dev/null
